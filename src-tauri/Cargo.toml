[package]
name = "loadplan"
version = "0.2.0"
description = "Container loading planner"
authors = ["Fleix <45186482@qq.com>"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
