<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载单机版 · 柜算 LOADPLAN</title>
<style>body{margin:0;background:#f4f4f5;color:#242424;font:16px/1.8 "Microsoft YaHei",sans-serif}main{max-width:800px;margin:48px auto;padding:32px;background:white;border:1px solid #ddd;border-radius:12px}h1{font-size:28px}a{color:inherit;text-underline-offset:4px}li{margin:20px 0}small{display:block;color:#626262}#status{color:#626262}@media(max-width:650px){main{margin:16px;padding:20px}}</style></head>
<body><main><a href="./">← 返回柜算</a><h1>下载单机版</h1><p>安装后无需联网，即可计算装柜方案、查看 3D，并导出 Excel、PDF 和图片。</p><p id="status" role="status">正在获取已发布版本…</p><ul id="downloads"></ul><p>macOS 使用临时签名，未经 Apple 公证，首次打开可能需要在“系统设置 → 隐私与安全性”中允许打开。Windows 安装包未做商业代码签名。</p><p><a href="https://github.com/fleixweb/Loadplan/releases">查看全部版本与安装说明</a> · <a href="license.html">开源许可</a></p><small>Powered by Fleix 45186482@qq.com</small></main>
<script>
const status=document.getElementById('status');
const options=[['Loadplan-Windows-x64.exe','Windows 安装包','Intel / AMD 64 位 Windows 10、11'],['Loadplan-macOS-Apple-Silicon.dmg','macOS Apple Silicon','M 系列芯片 Mac，macOS 12 或更新版本'],['Loadplan-macOS-Intel.dmg','macOS Intel','Intel 芯片 Mac，macOS 12 或更新版本']];
function showRelease(release){status.textContent='当前版本：'+release.tag_name;document.getElementById('downloads').replaceChildren();for(const [name,label,description] of options){const asset=release.assets.find(a=>a.name===name);if(!asset)continue;const url=new URL(asset.browser_download_url);if(url.origin!=='https://github.com'||!url.pathname.startsWith('/fleixweb/Loadplan/releases/download/'))continue;const li=document.createElement('li'),a=document.createElement('a'),small=document.createElement('small');a.href=url.href;a.textContent='下载 '+label;small.textContent=description+' · '+(asset.size/1024/1024).toFixed(1)+' MB';li.append(a,small);document.getElementById('downloads').append(li);}}
let hasRelease=false;
fetch('release.json').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(release=>{showRelease(release);hasRelease=true;}).catch(()=>{}).finally(()=>{
fetch('https://api.github.com/repos/fleixweb/Loadplan/releases/latest',{signal:AbortSignal.timeout(8000)}).then(async response=>{if(!response.ok)throw new Error();showRelease(await response.json());}).catch(()=>{if(!hasRelease)status.textContent='暂时无法获取版本，请通过下方链接前往 GitHub 下载。';});
});
</script></body></html>
